# Example Dashica Configuration for Dev Server
# Copy this to dashica_config.yaml and adjust values for your environment

# For Docker Compose setup (docker-compose.dev.yml), use these settings:
clickhouse:
  # Main ClickHouse connection for data queries
  default:
    url: http://localhost:8123
    user: default
    password: password
    database: default

  # Storage for alert results (required even if not using alerts)
  alert_storage:
    url: http://localhost:8123
    user: default
    password: password
    database: default

# If using a remote or custom ClickHouse instance, update the settings above

# Logging configuration
log:
  file_name: /tmp/dashica-dev.log
  to_stdout: true  # Set to true for console output during development

# Alerting configuration (optional for dev server)
alerting:
  helvetikit_alerting_url: ""
  helvetikit_id_group: ""

# Signs the page's filter pills (docs/2026-10-28-workbench.md §3.8); required, the server refuses to start without
# it. At least 32 characters, never checked in: generate one with `openssl rand -hex 32`, or set FILTERS__SECRET.
filters:
  secret: ""
  # The page's SQL chips (`?sql=`, docs/2026-10-28-workbench.md §3.15): the viewer's own SQL in every chart's WHERE,
  # typed in the filter bar. Off by default: a `sql` is then a 400. Or FILTERS__SQLENABLED=true (not both: a key here
  # wins over the environment's).
  sqlEnabled: false
