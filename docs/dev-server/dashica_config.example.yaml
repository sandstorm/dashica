# Dashica configuration for the dev server, with the Docker Compose setup (docker-compose.dev.yml).
# Copy this to dashica_config.yaml. Every other key, its default and its environment variable:
# dashica_config.example.yaml in the repository root.
#
# Also required, in the environment only: APP_SECRET (signs the page's filters; the server does not start without
# it), e.g. `export APP_SECRET=$(openssl rand -hex 32)`.
clickhouse:
  # Main ClickHouse connection for data queries
  default:
    url: http://localhost:8123
    user: default
    password: password
    database: default

  # Storage for alert results (the server does not start without this connection, even without alerts)
  alert_storage:
    url: http://localhost:8123
    user: default
    password: password
    database: default

log_filename: /tmp/dashica-dev.log
